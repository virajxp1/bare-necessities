# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
# General one-page resume (AI platform / agent quality / senior backend). Facts: career-profile.yaml (local only, gitignored: contains internal names)
# Style rules (from the resume critique pass):
#   - No internal product, project, or system names. Describe what the thing does instead.
#   - Job titles stay clean for ATS parsing; promotions go in the entry summary, not the title.
#   - Bullets vary in length and shape. No semicolon chains, no bolded product names, no "specializing in".
cv:
  name: Viraj Parikh
  headline: Senior Software Engineer II, AI Platform
  location: Cambridge, MA
  email: virajxp1@gmail.com
  website: https://bare-necessities.studio
  social_networks:
    - network: LinkedIn
      username: vhparikh
    - network: GitHub
      username: virajxp1
  sections:
    summary:
      - "Senior Software Engineer II on HubSpot's AI Platform, building infrastructure that helps engineering teams evaluate, observe, and improve AI agents in production. Work spans distributed tracing, agent evaluation, production quality monitoring, and workflows that turn real agent behavior into eval test cases."
    experience:
      - company: HubSpot
        position: Senior Software Engineer, AI Platform
        start_date: 2025-01
        end_date: present
        location: Remote
        summary: "Promoted to Senior Software Engineer II in August 2026. Generative AI Platform team, then Agent Quality."
        highlights:
          - "Built HubSpot's in-house LLM evaluation and observability platform as a replacement for Braintrust, which couldn't handle our requirements or our trace ingestion volume. Teams run it from code or from a UI I built most of. It now covers the company's highest-traffic internal and customer-facing agents."
          - "Teams define a task and an agent, then kick off sweeps across models, configurations, and prompt variants in one go. Results plot a Pareto frontier of quality against cost and latency, so teams can see which model, config, or prompt tweak actually wins."
          - "Built skill evals, skill grading, and skill linting for agent skills and tools, plus CI/CD workflows that show developers how their tools and skills are holding up on every change."
          - "Built continuous online scoring of live agent traffic with LLM judges and custom evaluators, producing about 315K scores a day across 120 components, with 890 judges registered across 693 components, plus an alerting system that catches significant step-function drops and feeds dashboards and eval comparisons."
          - "Built topic labeling with fast single-pass (System 1) LLM judges and scorers that group production traces into per-agent categories, plus analysis views that show owners where their agent does badly."
          - "Built an inbox that proactively proposes fixes to agent owners. Its main job turns real production traces into new eval cases."
          - "Helped design and ship company-wide OpenTelemetry tracing for AI calls, carrying context across API requests, async jobs, Kafka consumers, and SQS queues. It ingests 200M traces a day from 10,000 components and is the data the whole platform runs on."
          - "Earlier: prompt A/B testing with p-value analysis, prompt replay, and automated prompt tuning."
      - company: HubSpot
        position: Senior Software Engineer, Calling
        start_date: 2023-08
        end_date: 2024-12
        location: Cambridge, MA
        summary: "Promoted from Software Engineer in August 2023."
        highlights:
          - "Cut a 150GB MySQL audit table by 90%. It had caused about 6 Vitess incidents a year. Those stopped."
          - "Replaced 12-hour test cycles with a leasing service for a shared pool of Twilio test numbers. Distributed rate limiting keeps one failing test from draining the pool. Test runs went up 12x, test costs dropped 50%, and all of Calling adopted it."
          - "Owned backend design for call holds, transfers, and coaching on a push-based, asynchronous call-control system."
          - "Reworked call-recording storage with Hadoop backfills and a 1-year retention policy, saving $100K+ in storage."
          - "Worked with data science to feed live call transcripts and customer runbooks into RAG systems for real-time call recommendations."
      - company: HubSpot
        position: Software Engineer, Calling
        start_date: 2022-08
        end_date: 2023-08
        location: Cambridge, MA
        highlights:
          - "Migrated Twilio webhook handling (1M+ requests a day) to a new service and added the metrics and alerting it was missing."
          - "Drove design of a vendor-agnostic conference calling platform built on webhooks, Kafka, REST, and MySQL."
    projects:
      - bullet: "**ForkFolio** (github.com/virajxp1/forkfolio): recipe app with an LLM pipeline that cleans, dedupes, and embeds recipes for semantic search (Next.js, FastAPI, pgvector)."
      - bullet: "**Auto Browse** (github.com/virajxp1/auto-browse): browser agent with a LangGraph planner driving Playwright (Python)."
    skills:
      - label: Languages
        details: Java, Python, TypeScript, SQL, React, Next.js, React Native
      - label: Backend
        details: Distributed systems, Kafka, FastAPI, MySQL, Vitess, Postgres, AWS (SQS), Hadoop, REST APIs, CI/CD
      - label: AI
        details: LLM evaluation, eval sweeps, LLM-as-judge, agent skills, RAG, embeddings, A/B testing, OpenTelemetry, LangGraph
    education:
      - institution: The University of Texas at Austin
        area: Electrical and Computer Engineering
        degree: BS
        start_date: 2018-08
        end_date: 2022-05
        location: Austin, TX
        summary: "GPA: 3.8"
design:
  theme: engineeringresumes
  page:
    size: us-letter
    top_margin: 0.4in
    bottom_margin: 0.4in
    left_margin: 0.5in
    right_margin: 0.5in
    show_top_note: false
    show_footer: false
  typography:
    line_spacing: 0.55em
    font_size:
      body: 9.5pt
      name: 22pt
      headline: 9.5pt
      connections: 9.5pt
  header:
    space_below_name: 0.2cm
    space_below_headline: 0.2cm
    space_below_connections: 0.25cm
  sections:
    space_between_regular_entries: 0.22cm
  section_titles:
    space_above: 0.35cm
    space_below: 0.15cm
