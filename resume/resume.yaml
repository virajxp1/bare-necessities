# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
# General one-page resume (AI platform / agent quality / senior backend). Facts: career-profile.yaml (local only, gitignored: contains internal names)
# Style rules (from the resume critique pass):
#   - No internal product, project, or system names. Describe what the thing does instead.
#   - Job titles stay clean for ATS parsing; promotions go in the entry summary, not the title.
#   - Bullets vary in length and shape. No semicolon chains, no bolded product names, no "specializing in".
cv:
  name: Viraj Parikh
  headline: Senior Software Engineer, AI Platform
  location: Cambridge, MA
  email: virajxp1@gmail.com
  website: https://bare-necessities.studio
  social_networks:
    - network: LinkedIn
      username: vhparikh
    - network: GitHub
      username: virajxp1
  sections:
    summary:
      - "Backend engineer, four years at HubSpot. I spent the first two on Calling infrastructure (Java, Kafka, MySQL, Twilio webhooks at 1M+ requests a day) and the last two building the AI platform that every HubSpot AI feature is now built, evaluated, traced, and monitored on. Currently also interim manager for a team of seven."
    experience:
      - company: HubSpot
        position: Interim Engineering Manager, AI Platform
        start_date: 2026-09
        end_date: present
        location: Remote
        highlights:
          - "Managing 7 engineers while still writing code on the eval platform."
      - company: HubSpot
        position: Senior Software Engineer, AI Platform
        start_date: 2025-01
        end_date: present
        location: Remote
        summary: "Promoted to Senior Software Engineer II in September 2026. Generative AI Platform team, then Agent Quality."
        highlights:
          - "Built the company-wide agent evaluation platform. Teams compare agent variants across models, prompts, and reasoning levels, with cost and latency next to quality. It replaced the old eval system and teams now run evals without our help."
          - "Built online scoring for live AI traffic with LLM-as-judge, agentic, and code-based (Java and Python) evaluators. Scores drive dashboards, regression alerts, and deploy gates in CI/CD."
          - "Built an inbox that proactively proposes improvements to agent owners. The main job turns production traces into eval cases, filtered by an LLM reviewer."
          - "Helped design and ship company-wide OpenTelemetry tracing for AI calls over 6 months. The hard part was carrying context across API requests, async jobs, Kafka consumers, and SQS queues. Then added ownership, access control, and sensitive-data redaction."
          - "Built prompt A/B testing end to end, from p-value analysis on the backend to the UI for reading results. Also prompt replay, automated prompt tuning, and a retention job that purged 900GB+ of stored generations."
          - "Shipped most of the new platform's front end: eval runs, comparisons, live progress, and in-browser scorer editing."
          - "Run a daily error-triage agent over our 6 services. Best catch: a multi-day crash loop caused by one poison message."
      - company: HubSpot
        position: Senior Software Engineer, Calling
        start_date: 2023-08
        end_date: 2024-12
        location: Cambridge, MA
        summary: "Promoted from Software Engineer in August 2023."
        highlights:
          - "Cut a 150GB MySQL audit table by 90%. It had caused about 6 Vitess incidents a year. Those stopped."
          - "Replaced 12-hour test cycles with a leasing service for a shared pool of Twilio test numbers. Distributed rate limiting keeps one failing test from draining the pool. Test runs went up 12x, test costs dropped 50%, and all of Calling adopted it."
          - "Owned backend design for call holds, transfers, and coaching on a push-based, asynchronous call-control system."
          - "Reworked call-recording storage with Hadoop backfills and a 1-year retention policy, projected to save $100K+ in storage."
          - "Worked with data science to feed live call transcripts and customer runbooks into RAG systems for real-time call recommendations."
      - company: HubSpot
        position: Software Engineer, Calling
        start_date: 2022-08
        end_date: 2023-08
        location: Cambridge, MA
        highlights:
          - "Migrated Twilio webhook handling (1M+ requests a day) to a new service and added the metrics and alerting it was missing."
          - "Led a vendor-agnostic conference calling platform built on webhooks, Kafka, REST, and MySQL."
    projects:
      - bullet: "**ForkFolio** (github.com/virajxp1/forkfolio): recipe app with an LLM pipeline that cleans, extracts, dedupes, and embeds recipes for semantic search. Next.js, FastAPI, Postgres with pgvector."
      - bullet: "**Auto Browse** (github.com/virajxp1/auto-browse): browser agent where a LangGraph planner drives Playwright step by step (Python)."
    skills:
      - label: Languages
        details: Java, Python, TypeScript, SQL, React, Next.js, React Native
      - label: Backend
        details: Distributed systems, Kafka, FastAPI, MySQL, Vitess, Postgres, AWS (SQS), Hadoop, REST APIs, CI/CD
      - label: AI
        details: LLM evaluation, LLM-as-judge, agents, RAG, embeddings, prompt engineering, A/B testing, OpenTelemetry, LangGraph
    education:
      - institution: The University of Texas at Austin
        area: Electrical and Computer Engineering
        degree: BS
        start_date: 2018-08
        end_date: 2022-05
        location: Austin, TX
        summary: "GPA: 3.8"
design:
  theme: engineeringresumes
  page:
    size: us-letter
    top_margin: 0.4in
    bottom_margin: 0.4in
    left_margin: 0.5in
    right_margin: 0.5in
    show_top_note: false
    show_footer: false
  typography:
    line_spacing: 0.55em
    font_size:
      body: 9.5pt
      name: 22pt
      headline: 9.5pt
      connections: 9.5pt
  header:
    space_below_name: 0.2cm
    space_below_headline: 0.2cm
    space_below_connections: 0.25cm
  sections:
    space_between_regular_entries: 0.22cm
  section_titles:
    space_above: 0.35cm
    space_below: 0.15cm
